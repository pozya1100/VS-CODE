    <meta charset="UTF-8" />

    <title>Грязнульки</title>
  </head>
  <body bgcolor="gray">
    <h1 align="center"><font color="Red">ТУТ ГРЯЗНУЛЬКИ</font></h1>
    <button
      id="music-btn"
      onclick="toggleMusic()"
      style="
        background-color: #27043f;
        color: #690738;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        padding: 15px 30px;
        cursor: pointer;
        margin-top: 20px;
        margin-left: 800px;
      "
    >
      Включить музыку
    </button>
    <audio id="bg-music" src="aero.mp3" loop></audio>

    <script>
      function toggleMusic() {
        const audio = document.getElementById("bg-music");
        const btn = document.getElementById("music-btn");

        if (audio.paused) {
          audio.play();
          btn.textContent = "Пауза";
        } else {
          audio.pause();
          btn.textContent = "Включить музыку";
        }
      }
    </script>
