  <body bgcolor="#4B0082">
    <h1 align="center">
      <font color="red" size="500">WELCOME TO ГАЗЯВА</font>
    </h1>
    <p align="center">
      <font color="red" size 900>Тут ты обретешь свободу всего</font>
    </p>
    <button
      id="music-btn"
      onclick="toggleMusic()"
      style="
        background-color: #27043f;
        color: #690738;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        padding: 15px 30px;
        cursor: pointer;
        margin-top: 20px;
        margin-left: 800px;
      "
    >
      Включить музыку
    </button>
    <audio id="bg-music" src="audio.mp3.mp3" loop></audio>

    <script>
      function toggleMusic() {
        const audio = document.getElementById("bg-music");
        const btn = document.getElementById("music-btn");

        if (audio.paused) {
          audio.play();
          btn.textContent = "Пауза";
        } else {
          audio.pause();
          btn.textContent = "Включить музыку";
        }
      }
    </script>
